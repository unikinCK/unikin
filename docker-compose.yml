name: unikin

services:
  unikin:
    build: .
    image: unikin:local
    container_name: unikin
    restart: unless-stopped
    # Ohne .env absichtlich kein Start: der Agent liefe sonst mit dem Platzhalter
    # "local-model" und würde sein Journal mit Fehlerschritten überschreiben.
    env_file:
      - .env
    environment:
      # Aus dem Container heraus ist LM Studio der Docker-Host, nicht localhost.
      # OPENAI_BASE_URL in .env gilt nur für den nativen Start; LMSTUDIO_URL überschreibt für Docker.
      OPENAI_BASE_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      # Werkzeuge vom Runner im internen Netz; RUNNER_MCP_URL= (leer) in .env schaltet sie ab.
      RUNNER_MCP_URL: ${RUNNER_MCP_URL-http://runner:8812/mcp}
      # Pfade im Container sind fest, die Daten liegen über die Volumes im Projektordner.
      MEMORY_FILE: /app/memory/unikin_state.json
      LOG_FILE: /app/logs/unikin.log
    extra_hosts:
      # Für Docker auf Linux nötig; Docker Desktop und Colima lösen den Namen auch ohne auf.
      - "host.docker.internal:host-gateway"
    networks:
      - default  # Weg zu LM Studio auf dem Host
      - sandbox  # nur zum Runner
    # Die Verzeichnisse müssen auf dem Host existieren (mkdir -p memory logs): so
    # legt Docker sie weder als root an (Linux) noch unsichtbar in der VM (Colima).
    volumes:
      - type: bind
        source: ./memory
        target: /app/memory
        bind:
          create_host_path: false
      - type: bind
        source: ./logs
        target: /app/logs
        bind:
          create_host_path: false
    # Abgestimmt auf OPENAI_TIMEOUT_SECONDS (Standard 120 s): ein laufender Modellaufruf
    # darf zu Ende kommen und seinen Zustand speichern, bevor Docker hart beendet.
    stop_grace_period: 150s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  runner:
    # python-http-mcp-runner, als Git-Submodul eingebunden (git submodule update --init).
    # Er führt den Code aus, den das Modell schreibt; der Runner-Code bleibt unverändert.
    build: ./runner
    image: unikin-runner:local
    container_name: unikin-runner
    restart: unless-stopped
    # Nur im internen Netz und ohne Port-Mapping: kein Internet, kein LAN, kein Host.
    # Erreichbar ist er allein für den unikin-Container unter http://runner:8812/mcp.
    networks:
      - sandbox
    environment:
      # Abbildungen und Berichte, die der Code erzeugt, liegen auf dem Host in artifacts/
      # und überleben so jedes Neuerstellen des Containers.
      PYTHON_MCP_ARTIFACT_DIR: /artifacts
      # 0 = der Runner löscht Artefakte nie selbst; aufgeräumt wird von Hand.
      PYTHON_MCP_ARTIFACT_RETENTION_DAYS: "0"
    # Wie memory/ und logs/: muss auf dem Host existieren (mkdir -p artifacts).
    # Der Runner bleibt UID 10001; unter Colima darf er ohne Rechteanpassung schreiben,
    # auf Linux-Hosts braucht artifacts/ Schreibrecht für UID 10001.
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          memory: 768M
          pids: 128
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  sandbox:
    internal: true
