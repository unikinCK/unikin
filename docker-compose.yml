name: unikin

services:
  unikin:
    build: .
    image: unikin:local
    container_name: unikin
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Aus dem Container heraus ist LM Studio der Docker-Host, nicht localhost.
      # OPENAI_BASE_URL in .env gilt nur für den nativen Start; LMSTUDIO_URL überschreibt für Docker.
      OPENAI_BASE_URL: ${LMSTUDIO_URL:-http://host.docker.internal:1234/v1}
      # Pfade im Container sind fest, die Daten liegen über die Volumes im Projektordner.
      MEMORY_FILE: /app/memory/unikin_state.json
      LOG_FILE: /app/logs/unikin.log
    extra_hosts:
      # Für Docker auf Linux nötig; Docker Desktop und Colima lösen den Namen auch ohne auf.
      - "host.docker.internal:host-gateway"
    volumes:
      - ./memory:/app/memory
      - ./logs:/app/logs
    # Abgestimmt auf OPENAI_TIMEOUT_SECONDS (Standard 120 s): ein laufender Modellaufruf
    # darf zu Ende kommen und seinen Zustand speichern, bevor Docker hart beendet.
    stop_grace_period: 150s
    deploy:
      resources:
        limits:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
